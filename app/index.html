    <script>
        const defaultThemeMode = 'light';
        const storedThemeMode = localStorage.getItem('kt-theme');
        let themeMode = storedThemeMode || document.documentElement.getAttribute('data-kt-theme-mode') || defaultThemeMode;
        if (themeMode === 'system') {
            themeMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(themeMode);
    </script>
